worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;

    # Upstream Services
    upstream auth_service {
        server auth-service:8081;
    }

    upstream quiz_service {
        server quiz-service:8082;
    }

    upstream payment_service {
        server payment-service:8083;
    }

    upstream chatbot_service {
        server chatbot-service:8084;
    }

    upstream ml_service {
        server ml-service:5000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Static Assets Proxy (if backend serves them)
        location /assets {
            proxy_pass http://quiz_service;
        }

        # Auth & User Routes
        location /api/v1/auth {
            proxy_pass http://auth_service;
        }
        location /api/auth {
            proxy_pass http://auth_service;
        }
        location /api/admin-users {
            proxy_pass http://auth_service;
        }
        location /api/adminUser {
            proxy_pass http://auth_service;
        }
        location /api/account {
            proxy_pass http://auth_service;
        }

        # Admin File Preview
        location /api/admin/preview-local-file {
            proxy_pass http://quiz_service;
        }

        # Swagger API Docs
        location /api/docs {
            proxy_pass http://quiz_service;
        }
        location /api/docs-json {
            proxy_pass http://quiz_service;
        }

        # Quiz & Learning Routes (and Vocabulary / Statistics / Uploads)
        location /api/v1/courses {
            proxy_pass http://quiz_service;
        }
        location /api/v1/tests {
            proxy_pass http://quiz_service;
        }
        location /api/v1/questions {
            proxy_pass http://quiz_service;
        }
        location /api/v1/test-attempts {
            proxy_pass http://quiz_service;
        }
        location /api/admin-tests {
            proxy_pass http://quiz_service;
        }
        location /api/adminTest {
            proxy_pass http://quiz_service;
        }
        location /api/admin-metadata {
            proxy_pass http://quiz_service;
        }
        location /api/adminMetadata {
            proxy_pass http://quiz_service;
        }
        location /api/v1/uploads {
            proxy_pass http://quiz_service;
        }
        location /api/v1/statistics {
            proxy_pass http://quiz_service;
        }
        location /api/vocabulary {
            proxy_pass http://quiz_service;
        }
        location /api/vocabularies {
            proxy_pass http://quiz_service;
        }

        # Payment Routes
        location /api/v1/payments {
            proxy_pass http://payment_service;
        }

        # Chatbot Routes
        location /api/v1/conversations {
            proxy_pass http://chatbot_service;
        }
        location /api/v1/users/me/conversations {
            proxy_pass http://chatbot_service;
        }

        # ML Recommendation API Routing
        location /api/ml {
            proxy_pass http://quiz_service;
        }
        location /predict {
            proxy_pass http://ml_service;
        }

        # API Gateway Health check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","gateway":true}';
            add_header Content-Type application/json;
        }
    }
}
