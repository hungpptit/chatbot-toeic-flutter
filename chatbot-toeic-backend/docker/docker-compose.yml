version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./db-init:/usr/src/app
    # Sử dụng command để chạy script import-data.sh ở chế độ chạy ngầm và khởi động SQL Server
    # sed -i 's/\r$//' dùng để sửa lỗi xuống dòng CRLF trên Windows nếu có
    entrypoint: >
      /bin/bash -c "
      sed -i 's/\r$$//' /usr/src/app/import-data.sh &&
      chmod +x /usr/src/app/import-data.sh &&
      /usr/src/app/import-data.sh &
      /opt/mssql/bin/sqlservr
      "

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_queue
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  ml-service:
    build:
      context: ..
      dockerfile: ml/Dockerfile
    container_name: ml_python_service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ML_PORT=5000
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=ChatbotToeic_Quiz
      - DB_USERNAME=sa
      - DB_PASS=YourStrongPassword123!
    depends_on:
      - db

  email-service:
    build:
      context: ..
      dockerfile: services/email-service/Dockerfile
    container_name: email_worker_service
    restart: always
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - rabbitmq

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8081
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=ChatbotToeic_Auth
      - DB_USERNAME=sa
      - DB_PASS=YourStrongPassword123!
      - DB_ENCRYPT=false
      - JWT_SECRET_KEY=ChatbotToeic_project
      - JWT_REFRESH_SECRET_KEY=ChatbotToeic_refresh_secret_key
      - JWT_EXPIRATION=7d
      - JWT_REFRESH_EXPIRATION=30d
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - db
      - rabbitmq

  quiz-service:
    build:
      context: ..
      dockerfile: services/quiz-service/Dockerfile
    container_name: quiz_service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8082
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=ChatbotToeic_Quiz
      - DB_USERNAME=sa
      - DB_PASS=YourStrongPassword123!
      - DB_ENCRYPT=false
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - ML_SERVICE_URL=http://ml-service:5000
      - SKIP_ML_SPAWN=true
    depends_on:
      - db
      - rabbitmq
      - ml-service

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    container_name: payment_service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8083
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=ChatbotToeic_Payment
      - DB_USERNAME=sa
      - DB_PASS=YourStrongPassword123!
      - DB_ENCRYPT=false
      - ZALOPAY_APP_ID=${ZALOPAY_APP_ID}
      - ZALOPAY_KEY1=${ZALOPAY_KEY1}
      - ZALOPAY_KEY2=${ZALOPAY_KEY2}
      - ZALOPAY_ENDPOINT=${ZALOPAY_ENDPOINT}
      - ZALOPAY_CALLBACK_URL=${ZALOPAY_CALLBACK_URL}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - db
      - rabbitmq

  chatbot-service:
    build:
      context: ..
      dockerfile: services/chatbot-service/Dockerfile
    container_name: chatbot_service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8084
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=ChatbotToeic_Chatbot
      - DB_USERNAME=sa
      - DB_PASS=YourStrongPassword123!
      - DB_ENCRYPT=false
      - GEMINI_API_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
    depends_on:
      - db

  api-gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - quiz-service
      - payment-service
      - chatbot-service
      - ml-service

  frontend:
    build:
      context: ../../chat_toeic_app
      dockerfile: ../chatbot-toeic-backend/docker/Dockerfile.frontend
    container_name: nginx_frontend
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - api-gateway

volumes:
  mssql_data:
